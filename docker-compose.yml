services:
  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    ports:
      - "50021:50021"
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      VOICEVOX_URL: http://voicevox:50021
    depends_on:
      - voicevox
    restart: unless-stopped
